<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Can I Eat?</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --line: #262b36;
    --fg: #e8eaed; --muted: #9aa3b2;
    --yes: #2fbf71; --no: #e25555; --warn: #e0a92e; --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 14px; }
  .verdict { text-align: center; padding: 28px 16px; }
  .verdict .big { font-size: 44px; font-weight: 800; letter-spacing: -1px; }
  .verdict .big.yes { color: var(--yes); }
  .verdict .big.no { color: var(--no); }
  .verdict .big.first { color: var(--accent); }
  .verdict .msg { margin-top: 8px; color: var(--muted); font-size: 14px; }
  .verdict .count { margin-top: 14px; font-size: 28px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .verdict .count small { display:block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type=text], input[type=number] {
    width: 100%; background: #0d0f14; border: 1px solid var(--line); color: var(--fg);
    border-radius: 10px; padding: 12px; font-size: 15px;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button {
    border: 0; border-radius: 10px; padding: 12px 14px; font-size: 15px; font-weight: 600;
    cursor: pointer; color: #fff; background: var(--accent);
  }
  button.ghost { background: #20242e; color: var(--fg); border: 1px solid var(--line); }
  button:active { transform: translateY(1px); }
  .h2 { font-size: 13px; color: var(--muted); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .6px; }
  .ai { margin-top: 12px; font-size: 14px; border-radius: 10px; padding: 12px; display: none; }
  .ai.show { display: block; }
  .ai.ok { background: rgba(47,191,113,.12); border: 1px solid rgba(47,191,113,.4); }
  .ai.bad { background: rgba(226,85,85,.12); border: 1px solid rgba(226,85,85,.4); }
  .ai.mild { background: rgba(224,169,46,.12); border: 1px solid rgba(224,169,46,.4); }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .hist li:last-child { border-bottom: 0; }
  .hist .t { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .note { color: var(--muted); font-size: 12px; text-align:center; margin-top: 6px; }
  .mt { margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍽️ Can I Eat?</h1>
    <span class="sub" id="cfg">—</span>
  </header>

  <div class="card verdict">
    <div class="big" id="big">…</div>
    <div class="msg" id="msg">상태 확인 중</div>
    <div class="count" id="count" style="display:none"><span id="countval">--:--:--</span><small id="countlabel"></small></div>
  </div>

  <div class="card">
    <p class="h2">먹기 전에 물어보기</p>
    <label for="food">뭘 먹/마시려고요?</label>
    <div class="row">
      <input type="text" id="food" placeholder="예: 블랙커피, 아메리카노, 사과 한 개" />
      <button id="checkBtn" style="flex:0 0 84px">확인</button>
    </div>
    <div class="ai" id="ai"></div>
    <button class="ghost mt" id="logBtn" style="width:100%">방금 먹었어요 (기록)</button>
  </div>

  <div class="card">
    <p class="h2">설정</p>
    <div class="row">
      <div><label>섭식 윈도우(시간)</label><input type="number" id="win" min="1" max="24" /></div>
      <div><label>최소 공복(시간)</label><input type="number" id="fast" min="1" max="24" /></div>
    </div>
    <button class="ghost mt" id="saveBtn" style="width:100%">저장</button>
  </div>

  <div class="card">
    <p class="h2">최근 기록</p>
    <ul class="hist" id="hist"><li><span>—</span></li></ul>
  </div>

  <p class="note" id="ainote"></p>
</div>

<script>
const API = '/api';
let timer = null, targetAt = null, targetLabel = '';

const $ = (id) => document.getElementById(id);
const j = (r) => r.json();

function fmtClock(ms) {
  if (ms <= 0) return '00:00:00';
  const s = Math.floor(ms / 1000);
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${ss}`;
}
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function renderStatus(d) {
  const s = d.status;
  $('cfg').textContent = `${d.settings.eating_window_hours}h 섭식 / ${d.settings.min_fast_hours}h 공복`;
  $('win').value = d.settings.eating_window_hours;
  $('fast').value = d.settings.min_fast_hours;

  const big = $('big'), msg = $('msg'), count = $('count');
  big.className = 'big';
  count.style.display = 'none';
  targetAt = null;

  if (s.state === 'first_meal') {
    big.textContent = '첫 끼예요'; big.classList.add('first');
    msg.textContent = '지금 먹으면 섭식 윈도우가 시작돼요.';
  } else if (s.canEat && s.state === 'in_window') {
    big.textContent = 'YES'; big.classList.add('yes');
    msg.textContent = '섭식 윈도우 안이에요. 먹어도 돼요.';
    targetAt = s.windowEndsAt; targetLabel = '윈도우 종료까지';
  } else if (s.canEat && s.state === 'ready_new_window') {
    big.textContent = 'YES'; big.classList.add('yes');
    msg.textContent = '공복을 다 채웠어요. 첫 끼 시작 가능!';
  } else {
    big.textContent = 'NO'; big.classList.add('no');
    msg.textContent = '아직 공복 시간이에요. 조금만 참아요.';
    targetAt = s.nextEatAt; targetLabel = '공복 해제까지';
  }

  if (targetAt) {
    count.style.display = 'block';
    $('countlabel').textContent = targetLabel;
    tick();
  }
}
function tick() {
  if (!targetAt) return;
  $('countval').textContent = fmtClock(targetAt - Date.now());
}

async function loadStatus() {
  try { renderStatus(await fetch(`${API}/status`).then(j)); } catch (e) { $('msg').textContent = '연결 실패'; }
}
async function loadHistory() {
  try {
    const d = await fetch(`${API}/history?limit=10`).then(j);
    const ul = $('hist');
    ul.innerHTML = d.meals.length ? '' : '<li><span>아직 기록이 없어요</span></li>';
    for (const m of d.meals) {
      const li = document.createElement('li');
      li.innerHTML = `<span>${m.label ? escapeHtml(m.label) : '식사'}</span><span class="t">${fmtTime(m.ate_at)}</span>`;
      ul.appendChild(li);
    }
  } catch (e) {}
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function showAi(v) {
  const el = $('ai');
  if (!v) {
    el.className = 'ai show mild';
    el.textContent = 'AI 판단을 사용할 수 없어요 (키 미설정). 기록은 그대로 됩니다.';
    return;
  }
  const cls = v.breaks_fast ? 'bad' : (v.severity === 'mild' ? 'mild' : 'ok');
  el.className = `ai show ${cls}`;
  el.textContent = (v.breaks_fast ? '⚠️ 공복을 깨요. ' : '✅ 공복 유지돼요. ') + (v.reason || '');
}

$('checkBtn').onclick = async () => {
  const label = $('food').value.trim();
  if (!label) return;
  $('ai').className = 'ai show mild'; $('ai').textContent = '확인 중…';
  try {
    const d = await fetch(`${API}/check`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ label }),
    }).then(j);
    if (!d.aiEnabled) return showAi(null);
    showAi(d.verdict);
  } catch (e) { $('ai').textContent = '확인 실패'; }
};

$('logBtn').onclick = async () => {
  const label = $('food').value.trim() || null;
  try {
    await fetch(`${API}/log`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ label }),
    });
    $('food').value = ''; $('ai').className = 'ai';
    await loadStatus(); await loadHistory();
  } catch (e) {}
};

$('saveBtn').onclick = async () => {
  const eating_window_hours = parseInt($('win').value, 10);
  const min_fast_hours = parseInt($('fast').value, 10);
  try {
    await fetch(`${API}/settings`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ eating_window_hours, min_fast_hours }),
    });
    await loadStatus();
  } catch (e) {}
};

setInterval(tick, 1000);
setInterval(loadStatus, 60000);
loadStatus(); loadHistory();
</script>
</body>
</html>
