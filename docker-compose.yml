# Can I Eat — 독립 실행 compose. doil.me 게이트웨이와 같은 외부 네트워크(dev-net)에
# 붙어, 게이트웨이 nginx 가 cie.doil.me → cie:3000 으로 프록시한다.
# DB 는 공유 Postgres 컨테이너(devdb) 안의 전용 database `cie` 를 쓴다.
#   사전: dev-net 존재 + 공유 db 컨테이너 가동 + database `cie` 1회 생성(README 참고)
#   docker compose up -d --build
services:
  cie:
    build: .
    container_name: cie
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=devdb          # 공유 dev Postgres 의 dev-net 별칭
      - DB_PORT=5432
      - DB_USER=doil
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}  # gitignore 된 .env 에서 주입
      - DB_NAME=cie            # 이 프로젝트 전용 database
      # AI 인증: claude CLI(Claude Code) OAuth 토큰 (`claude setup-token` 발급). 없으면 결정론 폴백.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    networks:
      - edge   # §5 F-6B: gw ingress 공용망 (dev-net에서 이전)
      - devdb   # §5 F-8: 메인 db(devdb) 전용망
    restart: unless-stopped

networks:
  edge:
    external: true
  devdb:
    external: true
